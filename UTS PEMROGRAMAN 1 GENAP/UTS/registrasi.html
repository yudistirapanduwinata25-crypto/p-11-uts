<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <header>
        <h1>Form registrasi seminar</h1>
        <p>Informasi dan pendaftaran kegiatan mahasiswa</p>
    </header>
    <nav>
            <a href="index.html">Home</a>
            <a href="pembicara.html">Pembicara</a>
            <a href="jadwal.html">Jadwal</a>
            <a href="dokumentasi.html">Dokumentasi</a>
            <a href="registrasi.html">Registrasi</a>
    </nav>
    <section>
        <h2>Form Registrasi</h2>
        <p>Selamat datang di website registrasi senimar</p>

        <form>
            <label>Nama Lengkap :</label>
            <input type="text" name="namalengkap"
            placeholder="Masukan Nama Lengkap" required/> <br> <br>

            <label>NIM</label>
            <input type="text" name="nim" placeholder="Masukan NIM Anda"required/> <br> <br>
            
            <label>Email:</label>
            <input type="email" name="email"placeholder="Masukan Email"required/> <br> <br>

            <label>Jenis Kelamin :</label>
            <input type="radio" name="gender" value="Laki-Laki"/>Laki-Laki <input type="radio" name="gender" value="Perempuan" /> Perempuan <br> <br>

            <label>Pilih Sesi</label> <br> 
            <select name="minat">
                <option value="">Pilih Sesi Anda</option>
                <option>Sesi 1 </option>
                <option>Sesi 2 </option>
                <option>Sesi 3</option>
                <option>Sesi 4</option>
            </select> <br> <br>

            <label>Status Peserta :</label>
            <input type="checkbox">Online
            <input type="checkbox">Offline
            <br> <br>

            <label>Pertanyaan :</label>
            <textarea name="pertanyaan" rows="5" cols="30"
            placeholder="Tuliskan jika ada yang ingin di tanyakan"
            ></textarea> <br> <br>

            <button type="submit">Registrasi</button>
                
            </button>
        </form>
    </section>
